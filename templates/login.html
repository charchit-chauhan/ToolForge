{% extends "base.html" %}
{% block title %}Sign in — ToolForge{% endblock %}
{% block guest %}
<div class="login-page">
  <div class="login-card">
    <div class="logo-row">
      <span class="logo-mark" style="width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#2563eb,#7c3aed);display:grid;place-items:center;color:#fff;font-size:1.1rem">🧰</span>
      <div><strong style="font-family:'Plus Jakarta Sans',sans-serif">ToolForge</strong><div style="font-size:0.72rem;color:#94a3b8">Utility Suite</div></div>
    </div>
    <h1>Welcome back</h1>
    <p class="login-sub">Sign in to access your tools and workspace.</p>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('login', next=request.args.get('next', '')) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group"><label for="email">Email</label><input type="email" id="email" name="email" placeholder="you@example.com" required autofocus maxlength="254" autocomplete="email" value="{{ request.form.email or '' }}" /></div>
      <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" placeholder="Your password" required maxlength="128" autocomplete="current-password" /></div>
      <button type="submit" class="btn btn-primary btn-block">Sign in →</button>
    </form>
    <p class="text-sm text-muted mt-2" style="text-align:center;margin-top:1.25rem">New to ToolForge? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
