{% extends "base.html" %}
{% block title %}QR Code Generator — Tool Forge{% endblock %}

{% block content %}
<div class="container">
  <div class="page-header">
    <h1 class="page-title">QR Code Generator</h1>
    <p class="page-sub">Create high-quality QR codes for any text, URL, or data.</p>
  </div>

  <div class="card">
    <div class="form-group">
      <label>Content</label>
      <textarea id="qrData" placeholder="https://example.com or any text…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Box size</label>
        <input type="number" id="qrBox" value="10" min="2" max="20" />
      </div>
      <div class="form-group">
        <label>Fill colour</label>
        <input type="text" id="qrFill" value="black" />
      </div>
      <div class="form-group">
        <label>Background</label>
        <input type="text" id="qrBg" value="white" />
      </div>
    </div>
    <button class="btn btn-primary" id="btnQr">📱 Generate QR Code</button>
    <div id="errorBox" class="alert alert-error hidden mt-2"></div>
    <div id="qrPreview" class="mt-3" style="text-align:center"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('btnQr').onclick = async () => {
  const errorBox = document.getElementById('errorBox');
  errorBox.classList.add('hidden');
  const data = document.getElementById('qrData').value.trim();
  if (!data) { errorBox.textContent = 'Enter some content'; errorBox.classList.remove('hidden'); return; }
  showLoading('Generating QR…');
  try {
    const res = await fetch('/api/qr', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        data,
        box_size: +document.getElementById('qrBox').value,
        fill_color: document.getElementById('qrFill').value,
        back_color: document.getElementById('qrBg').value
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      throw new Error(err.error || 'Failed');
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById('qrPreview').innerHTML =
      `<img src="${url}" alt="QR Code" style="max-width:280px;border-radius:12px;border:1px solid var(--border)" />
       <div class="mt-2"><a class="btn btn-secondary" href="${url}" download="qrcode.png">⬇️ Download PNG</a></div>`;
  } catch(e) {
    errorBox.textContent = e.message;
    errorBox.classList.remove('hidden');
  } finally { hideLoading(); }
};
</script>
{% endblock %}
